services:
  - type: web
    name: marketledger-pro
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: MARKETLEDGER_DATA_DIR
        value: /tmp/marketledger
      - key: MARKETLEDGER_PASSWORD
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
