services:
  - type: web
    name: marketledger-pro
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: MARKETLEDGER_DATA_DIR
        value: /tmp/marketledger
      - key: MARKETLEDGER_PASSWORD
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketledger-db
          property: connectionString

databases:
  - name: marketledger-db
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: marketledger
    user: marketledger
    ipAllowList: []
